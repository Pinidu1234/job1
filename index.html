<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.json">

<title>Sri Lanka Job Calendar</title>

<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    overflow-x:hidden;
}

body{
    background:#0f172a;
    color:#fff;
    font-family:Arial,"Noto Sans Sinhala",sans-serif;
}

button,
input,
select{
    font-family:inherit;
}

.app{
    width:100%;
    max-width:600px;
    margin:0 auto;
    padding:7px;
}

/* HEADER */

header{
    background:#1e293b;
    border-radius:12px;
    padding:12px;
    margin-bottom:7px;
}

header h2{
    margin:0;
    font-size:18px;
}

header p{
    margin:3px 0 0;
    color:#94a3b8;
    font-size:9px;
}

/* NAVIGATION */

.nav{
    width:100%;
    display:grid;
    grid-template-columns:38px 1fr 38px;
    gap:4px;
    margin-bottom:6px;
}

.nav button,
.inputBtn,
.outputBtn{
    height:36px;
    border:1px solid #334155;
    border-radius:7px;
    background:#1e293b;
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.nav button:active,
.inputBtn:active,
.outputBtn:active,
.todayBtn:active{
    transform:scale(.97);
}

.month{
    height:36px;
    background:#1e293b;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:bold;
}

/* ACTIONS */

.actions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:5px;
    margin-bottom:6px;
}

.inputBtn,
.outputBtn{
    width:100%;
    height:36px;
}

.inputBtn input{
    display:none;
}

/* TODAY */

.todayBtn{
    width:100%;
    height:34px;
    margin-bottom:6px;
    background:#1e293b;
    color:white;
    border:1px solid #334155;
    border-radius:7px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
}

/* LEGEND */

.legend{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:3px;
    margin-bottom:6px;
}

.legend span{
    padding:5px 1px;
    border-radius:5px;
    text-align:center;
    font-size:7px;
    font-weight:bold;
    white-space:nowrap;
}

.l-day{background:#15803d}
.l-night{background:#1d4ed8}
.l-off{background:#475569}
.l-leave{background:#ca8a04}
.l-holiday{background:#991b1b}

/* CALENDAR */

.calendar{
    width:100%;
    background:#1e293b;
    border-radius:10px;
    padding:4px;
}

.week,
.days{
    width:100%;
    display:grid;
    grid-template-columns:repeat(7,minmax(0,1fr));
    gap:2px;
}

.week{
    margin-bottom:2px;
}

.week div{
    min-width:0;
    text-align:center;
    color:#94a3b8;
    font-size:8px;
    font-weight:bold;
    padding:3px 0;
}

.day{
    min-width:0;
    width:100%;
    min-height:68px;
    background:#0f172a;
    border:1px solid #263449;
    border-radius:6px;
    padding:3px 2px;
    cursor:pointer;
    overflow:hidden;
}

.day:active{
    transform:scale(.98);
}

.empty{
    background:transparent;
    border:0;
    cursor:default;
}

.num{
    font-size:10px;
    font-weight:bold;
    line-height:12px;
}

.sun .num{
    color:#f87171;
}

.today{
    border:2px solid #facc15 !important;
}

/* SHIFT */

.shift{
    width:100%;
    margin-top:2px;
    padding:3px 1px;
    border-radius:4px;
    text-align:center;
    font-size:6px;
    line-height:8px;
    font-weight:bold;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.day-shift{background:#15803d}
.night-shift{background:#1d4ed8}
.off-shift{background:#475569}
.leave-shift{background:#ca8a04}
.holiday{background:#991b1b}

.hours{
    margin-top:2px;
    text-align:center;
    color:#facc15;
    font-size:6px;
    font-weight:bold;
}

.holiday-name{
    margin-top:1px;
    color:#fca5a5;
    font-size:5px;
    text-align:center;
    line-height:6px;
    overflow:hidden;
}

/* SUMMARY */

.summary{
    width:100%;
    display:grid;
    grid-template-columns:repeat(5,minmax(0,1fr));
    gap:3px;
    margin-top:6px;
}

.card{
    min-width:0;
    background:#1e293b;
    border-radius:7px;
    padding:6px 2px;
    text-align:center;
}

.card small{
    display:block;
    color:#94a3b8;
    font-size:6px;
    white-space:nowrap;
}

.card b{
    display:block;
    margin-top:2px;
    font-size:13px;
}

/* MODALS */

.modal,
.outputMenu{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,.78);
    display:none;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:1000;
}

.modal.show,
.outputMenu.show{
    display:flex;
}

.box,
.outputBox{
    width:100%;
    max-width:340px;
    background:#1e293b;
    border-radius:14px;
    padding:16px;
}

.box h3,
.outputBox h3{
    margin:0 0 5px;
    font-size:17px;
}

.date{
    color:#94a3b8;
    font-size:11px;
    margin-bottom:12px;
}

label.formLabel{
    display:block;
    color:#cbd5e1;
    font-size:11px;
    margin:9px 0 4px;
}

select,
input[type="time"]{
    width:100%;
    height:40px;
    background:#0f172a;
    color:#fff;
    border:1px solid #475569;
    border-radius:8px;
    padding:0 9px;
    font-size:14px;
    outline:none;
}

select:focus,
input[type="time"]:focus{
    border-color:#60a5fa;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:13px;
}

.buttons button,
.outputButtons button,
.closeOutput,
.delete{
    height:40px;
    border:0;
    border-radius:8px;
    color:#fff;
    font-weight:bold;
    cursor:pointer;
}

.cancel{
    background:#475569;
}

.save{
    background:#16a34a;
}

.delete{
    width:100%;
    margin-top:6px;
    background:#dc2626;
}

/* OUTPUT */

.outputButtons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    margin-top:12px;
}

.excelExport{
    background:#15803d;
}

.csvExport{
    background:#2563eb;
}

.closeOutput{
    width:100%;
    margin-top:7px;
    background:#475569;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:20px;
    transform:translateX(-50%) translateY(20px);
    background:#020617;
    color:white;
    border:1px solid #334155;
    padding:10px 16px;
    border-radius:8px;
    font-size:11px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:3000;
    max-width:90%;
    text-align:center;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

/* SMALL PHONES */

@media(max-width:360px){

    .app{
        padding:5px;
    }

    header{
        padding:10px;
    }

    header h2{
        font-size:16px;
    }

    .nav{
        grid-template-columns:32px 1fr 32px;
    }

    .nav button,
    .inputBtn,
    .outputBtn,
    .month{
        height:32px;
        font-size:9px;
    }

    .day{
        min-height:60px;
        padding:2px 1px;
    }

    .num{
        font-size:9px;
    }

    .shift{
        font-size:5px;
        line-height:7px;
        padding:2px 0;
    }

    .hours{
        font-size:5px;
    }

    .holiday-name{
        font-size:4px;
    }

    .legend span{
        font-size:6px;
    }

    .card{
        padding:5px 1px;
    }

    .card small{
        font-size:5px;
    }

    .card b{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="app">

<header>
    <h2>🇱🇰 Sri Lanka Job Calendar</h2>
    <p>Shift • Leave • Working Hours • Excel • CSV</p>
</header>

<div class="nav">

    <button type="button" onclick="prevMonth()">◀</button>

    <div class="month" id="monthTitle"></div>

    <button type="button" onclick="nextMonth()">▶</button>

</div>

<div class="actions">

    <label class="inputBtn">
        📥 INPUT
        <input
            type="file"
            id="dataInput"
            accept=".xlsx,.xls,.csv"
        >
    </label>

    <button
        type="button"
        class="outputBtn"
        onclick="showOutputMenu()">
        📤 OUTPUT
    </button>

</div>

<button
    type="button"
    class="todayBtn"
    onclick="todayMonth()">
    📅 අද මාසයට යන්න
</button>

<div class="legend">

    <span class="l-day">☀️ DAY</span>
    <span class="l-night">🌙 NIGHT</span>
    <span class="l-off">🟢 OFF</span>
    <span class="l-leave">🟡 නිවාඩු</span>
    <span class="l-holiday">🔴 HOLIDAY</span>

</div>

<div class="calendar">

    <div class="week">
        <div>ඉරි</div>
        <div>සඳු</div>
        <div>අඟ</div>
        <div>බදා</div>
        <div>බ්‍රහ</div>
        <div>සිකු</div>
        <div>සෙන</div>
    </div>

    <div class="days" id="calendarDays"></div>

</div>

<div class="summary">

    <div class="card">
        <small>☀️ DAY</small>
        <b id="dayCount">0</b>
    </div>

    <div class="card">
        <small>🌙 NIGHT</small>
        <b id="nightCount">0</b>
    </div>

    <div class="card">
        <small>🟢 OFF</small>
        <b id="offCount">0</b>
    </div>

    <div class="card">
        <small>🟡 LEAVE</small>
        <b id="leaveCount">0</b>
    </div>

    <div class="card">
        <small>⏱️ පැය</small>
        <b id="hoursCount">0h</b>
    </div>

</div>

</div>


<!-- SHIFT MODAL -->

<div class="modal" id="shiftModal">

    <div class="box">

        <h3>📅 Shift / නිවාඩු</h3>

        <div class="date" id="selectedDate"></div>

        <label class="formLabel">Status</label>

        <select id="shiftType">

            <option value="">Select</option>

            <option value="day">
                ☀️ DAY
            </option>

            <option value="night">
                🌙 NIGHT
            </option>

            <option value="off">
                🟢 OFF
            </option>

            <option value="leave">
                🟡 නිවාඩු
            </option>

        </select>

        <label class="formLabel">🟢 IN</label>

        <input
            type="time"
            id="inTime"
        >

        <label class="formLabel">🔴 OUT</label>

        <input
            type="time"
            id="outTime"
        >

        <div class="buttons">

            <button
                type="button"
                class="cancel"
                onclick="closeModal()">
                Cancel
            </button>

            <button
                type="button"
                class="save"
                onclick="saveShift()">
                💾 Save
            </button>

        </div>

        <button
            type="button"
            class="delete"
            onclick="deleteShift()">
            🗑 Delete
        </button>

    </div>

</div>


<!-- OUTPUT MODAL -->

<div class="outputMenu" id="outputMenu">

    <div class="outputBox">

        <h3>📤 OUTPUT</h3>

        <div style="
            color:#94a3b8;
            font-size:11px;
            margin-top:3px;
        ">
            File type එක තෝරන්න
        </div>

        <div class="outputButtons">

            <button
                type="button"
                class="excelExport"
                onclick="exportExcel()">
                📊 Excel
            </button>

            <button
                type="button"
                class="csvExport"
                onclick="exportCSV()">
                📄 CSV
            </button>

        </div>

        <button
            type="button"
            class="closeOutput"
            onclick="closeOutputMenu()">
            Cancel
        </button>

    </div>

</div>

<div id="toast" class="toast"></div>


<script>

/* =========================================================
   APP SETTINGS
========================================================= */

const STORAGE_KEY = "jobCalendarData";

let currentDate = new Date();
let selectedDate = "";


/* =========================================================
   MONTHS
========================================================= */

const months = [
    "ජනවාරි",
    "පෙබරවාරි",
    "මාර්තු",
    "අප්‍රේල්",
    "මැයි",
    "ජූනි",
    "ජූලි",
    "අගෝස්තු",
    "සැප්තැම්බර්",
    "ඔක්තෝබර්",
    "නොවැම්බර්",
    "දෙසැම්බර්"
];


/* =========================================================
   HOLIDAYS
   NOTE: මේ list එක අවශ්‍ය නම් වෙනස් කරන්න.
========================================================= */

const holidays = {

    "2026-01-03":"Duruthu Poya",
    "2026-01-15":"Thai Pongal",
    "2026-02-01":"Navam Poya",
    "2026-02-04":"National Day",
    "2026-02-15":"Maha Sivarathri",
    "2026-03-02":"Madin Poya",
    "2026-03-21":"Eid al-Fitr",
    "2026-04-01":"Bak Poya",
    "2026-04-03":"Good Friday",
    "2026-04-13":"New Year Eve",
    "2026-04-14":"New Year Day",
    "2026-05-01":"Vesak Poya / May Day",
    "2026-05-28":"Eid al-Adha",
    "2026-05-30":"Adhi Poson Poya",
    "2026-05-31":"Vesak Holiday",
    "2026-06-29":"Poson Poya",
    "2026-07-29":"Esala Poya",
    "2026-08-26":"Milad-Un-Nabi",
    "2026-08-27":"Nikini Poya",
    "2026-09-26":"Binara Poya",
    "2026-10-25":"Vap Poya",
    "2026-11-08":"Deepavali",
    "2026-11-24":"Il Poya",
    "2026-12-23":"Unduvap Poya",
    "2026-12-25":"Christmas"

};


/* =========================================================
   HELPERS
========================================================= */

function $(id){
    return document.getElementById(id);
}


function showToast(message){

    const toast = $("toast");

    toast.textContent = message;
    toast.classList.add("show");

    clearTimeout(showToast.timer);

    showToast.timer = setTimeout(() => {
        toast.classList.remove("show");
    }, 2200);
}


/* =========================================================
   STORAGE
========================================================= */

function getData(){

    try{

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if(!saved){
            return {};
        }

        const parsed =
            JSON.parse(saved);

        return parsed &&
               typeof parsed === "object"
            ? parsed
            : {};

    }catch(error){

        console.error(error);

        return {};

    }

}


function saveData(data){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(data)
        );

    }catch(error){

        console.error(error);

        showToast(
            "Data save කරන්න බැරි වුණා."
        );

    }

}


/* =========================================================
   DATE
========================================================= */

function dateKey(year, month, day){

    return (
        String(year) +
        "-" +
        String(month + 1).padStart(2,"0") +
        "-" +
        String(day).padStart(2,"0")
    );

}


function getTodayKey(){

    const now = new Date();

    return dateKey(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
    );

}


/* =========================================================
   HOURS
========================================================= */

function calculateHours(start, end){

    if(!start || !end){
        return 0;
    }

    const s =
        String(start).split(":").map(Number);

    const e =
        String(end).split(":").map(Number);

    if(
        s.length < 2 ||
        e.length < 2 ||
        Number.isNaN(s[0]) ||
        Number.isNaN(s[1]) ||
        Number.isNaN(e[0]) ||
        Number.isNaN(e[1])
    ){

        return 0;

    }

    let startMinutes =
        s[0] * 60 + s[1];

    let endMinutes =
        e[0] * 60 + e[1];

    if(endMinutes <= startMinutes){
        endMinutes += 1440;
    }

    return (
        endMinutes - startMinutes
    ) / 60;

}


function formatHours(hours){

    const n = Number(hours) || 0;

    return Number.isInteger(n)
        ? String(n)
        : n.toFixed(1);

}


/* =========================================================
   RENDER CALENDAR
========================================================= */

function renderCalendar(){

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    $("monthTitle").textContent =
        months[month] + " " + year;


    const calendar =
        $("calendarDays");

    calendar.innerHTML = "";


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const totalDays =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        empty.className =
            "day empty";

        calendar.appendChild(empty);

    }


    const data =
        getData();


    const todayKey =
        getTodayKey();


    for(
        let day = 1;
        day <= totalDays;
        day++
    ){

        const key =
            dateKey(
                year,
                month,
                day
            );


        const cell =
            document.createElement("div");

        cell.className = "day";


        if(key === todayKey){

            cell.classList.add("today");

        }


        const weekday =
            new Date(
                year,
                month,
                day
            ).getDay();


        if(weekday === 0){

            cell.classList.add("sun");

        }


        let html =
            `<div class="num">${day}</div>`;


        /* HOLIDAY */

        if(holidays[key]){

            html += `
                <div class="shift holiday">
                    🔴 HOLIDAY
                </div>

                <div class="holiday-name">
                    ${escapeHTML(holidays[key])}
                </div>
            `;

        }


        /* SHIFT */

        const x = data[key];


        if(x){

            let className = "";
            let text = "";


            if(x.type === "day"){

                className = "day-shift";

                text =
                    "☀️ " +
                    (x.in || "08:00") +
                    "→" +
                    (x.out || "20:00");

            }

            else if(x.type === "night"){

                className = "night-shift";

                text =
                    "🌙 " +
                    (x.in || "20:00") +
                    "→" +
                    (x.out || "08:00");

            }

            else if(x.type === "off"){

                className = "off-shift";

                text = "🟢 OFF";

            }

            else if(x.type === "leave"){

                className = "leave-shift";

                text = "🟡 නිවාඩු";

            }


            if(className){

                html += `
                    <div class="shift ${className}">
                        ${escapeHTML(text)}
                    </div>
                `;

            }


            if(
                x.type === "day" ||
                x.type === "night"
            ){

                const hours =
                    calculateHours(
                        x.in,
                        x.out
                    );


                html += `
                    <div class="hours">
                        ⏱️ ${formatHours(hours)}h
                    </div>
                `;

            }

        }


        cell.innerHTML = html;

        cell.addEventListener(
            "click",
            () => openModal(key)
        );


        calendar.appendChild(cell);

    }


    updateSummary();

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   MODAL
========================================================= */

function openModal(key){

    selectedDate = key;

    $("selectedDate").textContent = key;


    const data =
        getData();

    const x =
        data[key];


    if(x){

/* =========================================================
   SUMMARY
========================================================= */

function updateSummary(){

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();

    const data =
        getData();


    let dayCount = 0;
    let nightCount = 0;
    let offCount = 0;
    let leaveCount = 0;
    let totalHours = 0;


    const totalDays =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let day = 1;
        day <= totalDays;
        day++
    ){

        const key =
            dateKey(
                year,
                month,
                day
            );


        const x =
            data[key];


        if(!x){
            continue;
        }


        if(x.type === "day"){
            dayCount++;
        }

        else if(x.type === "night"){
            nightCount++;
        }

        else if(x.type === "off"){
            offCount++;
        }

        else if(x.type === "leave"){
            leaveCount++;
        }


        if(
            x.type === "day" ||
            x.type === "night"
        ){

            totalHours +=
                calculateHours(
                    x.in,
                    x.out
                );

        }

    }


    $("dayCount").textContent =
        dayCount;

    $("nightCount").textContent =
        nightCount;

    $("offCount").textContent =
        offCount;

    $("leaveCount").textContent =
        leaveCount;

    $("hoursCount").textContent =
        formatHours(totalHours) + "h";

}

/* =========================================================
   CSV HELPERS
========================================================= */

function csvClean(value){

    return '"' +
        String(value ?? "")
            .replace(/"/g,'""') +
        '"';

}


/* =========================================================
   EXPORT CSV
========================================================= */

function exportCSV(){

    const rows =
        getMonthRows();


    let csv =
        "\uFEFF";


    csv +=
        "Date,Shift,IN,OUT,Worked Hours,Holiday\n";


    rows.forEach(row => {

        csv +=

            csvClean(row.Date) + "," +
            csvClean(row.Shift) + "," +
            csvClean(row.IN) + "," +
            csvClean(row.OUT) + "," +
            csvClean(row["Worked Hours"]) + "," +
            csvClean(row.Holiday) +
            "\n";

    });


    const blob =
        new Blob(
            [csv],
            {
                type:
                    "text/csv;charset=utf-8;"
            }
        );


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href = url;


    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    link.download =
        "Job-Calendar-" +
        year +
        "-" +
        String(month + 1).padStart(2,"0") +
        ".csv";


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(() => {
        URL.revokeObjectURL(url);
    },100);


    closeOutputMenu();

    showToast(
        "📄 CSV exported"
    );

}

function importData(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file){
        return;
    }


    const name =
        file.name.toLowerCase();


    if(name.endsWith(".csv")){

        importCSV(file);

    }

    else if(
        name.endsWith(".xlsx") ||
        name.endsWith(".xls")
    ){

        importExcel(file);

    }

    else{

        showToast(
            "❌ Unsupported file"
        );

    }


    event.target.value = "";

}


/* =========================================================
   EXCEL IMPORT
========================================================= */

function importExcel(file){

    if(typeof XLSX === "undefined"){

        showToast(
            "Excel library එක load වෙලා නැහැ."
        );

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(event){

            try{

                const workbook =
                    XLSX.read(
                        event.target.result,
                        {
                            type:"array",
                            cellDates:true
                        }
                    );


                if(
                    !workbook.SheetNames ||
                    !workbook.SheetNames.length
                ){

                    showToast(
                        "❌ Excel sheet එකක් නැහැ."
                    );

                    return;

                }


                const sheet =
                    workbook.Sheets[
                        workbook.SheetNames[0]
                    ];


                const rows =
                    XLSX.utils.sheet_to_json(
                        sheet,
                        {
                            defval:"",
                            raw:true
                        }
                    );


                importRows(rows);

            }
            catch(error){

                console.error(error);

                showToast(
                    "❌ Excel file එක read කරන්න බැරි වුණා."
                );

            }

        };


    reader.onerror = function(){

        showToast(
            "❌ File read error."
        );

    };


    reader.readAsArrayBuffer(file);

}


/* =========================================================
   CSV IMPORT
========================================================= */

function importCSV(file){

    const reader =
        new FileReader();


    reader.onload =
        function(event){

            try{

                let text =
                    event.target.result;


                text =
                    text.replace(
                        /^\uFEFF/,
                        ""
                    );


                const rows =
                    parseCSV(text);


                if(rows.length < 2){

                    showToast(
                        "❌ CSV file එකේ data නැහැ."
                    );

                    return;

                }


                const headers =
                    rows[0].map(
                        header =>
                            String(header)
                                .trim()
                    );


                const objects = [];


                for(
                    let i = 1;
                    i < rows.length;
                    i++
                ){

                    const current =
                        rows[i];


                    if(
                        current.every(
                            value =>
                                String(value).trim() === ""
                        )
                    ){

                        continue;

                    }


                    const obj = {};


                    headers.forEach(
                        (header,index) => {

                            obj[header] =
                                current[index] ?? "";

                        }
                    );


                    objects.push(obj);

                }


                importRows(objects);

            }
            catch(error){

                console.error(error);

                showToast(
                    "❌ CSV file එක read කරන්න බැරි වුණා."
                );

            }

        };


    reader.onerror = function(){

        showToast(
            "❌ File read error."
        );

    };


    reader.readAsText(
        file,
        "UTF-8"
    );

}


/* =========================================================
   FIND COLUMN
   Excel/CSV heading වෙනස් වුණත් වැඩ කරන්න
========================================================= */

function getColumn(row,names){

    const keys =
        Object.keys(row);


    for(const wanted of names){

        const exact =
            keys.find(
                key =>
                    String(key)
                        .trim()
                        .toLowerCase() ===
                    wanted.toLowerCase()
            );


        if(exact !== undefined){

            return row[exact];

        }

    }


    return "";

}


/* =========================================================
   IMPORT ROWS
========================================================= */

function importRows(rows){

    const data =
        getData();


    let imported = 0;
    let skipped = 0;

    let firstImportedDate = "";


    rows.forEach(row => {

        const rawDate =
            getColumn(
                row,
                [
                    "Date",
                    "date",
                    "DATE"
                ]
            );


        const date =
            normalizeDate(rawDate);


        if(!date){

            skipped++;

            return;

        }


        const rawShift =
            getColumn(
                row,
                [
                    "Shift",
                    "shift",
                    "SHIFT",
                    "Status",
                    "status"
                ]
            );


        const shift =
            normalizeShift(rawShift);


        if(!shift){

            skipped++;

            return;

        }


        const rawIn =
            getColumn(
                row,
                [
                    "IN",
                    "In",
                    "in",
                    "Start",
                    "start"
                ]
            );


        const rawOut =
            getColumn(
                row,
                [
                    "OUT",
                    "Out",
                    "out",
                    "End",
                    "end"
                ]
            );


        let inTime =
            convertTime(rawIn);

        let outTime =
            convertTime(rawOut);


        if(shift === "day"){

            if(!inTime){
                inTime = "08:00";
            }

            if(!outTime){
                outTime = "20:00";
            }

        }


        if(shift === "night"){

            if(!inTime){
                inTime = "20:00";
            }

            if(!outTime){
                outTime = "08:00";
            }

        }


        data[date] = {

            type: shift,

            in: inTime,

            out: outTime

        };


        imported++;


        if(!firstImportedDate){

            firstImportedDate = date;

        }

    });


    saveData(data);


    if(firstImportedDate){

        const parts =
            firstImportedDate.split("-");


        currentDate =
            new Date(
                Number(parts[0]),
                Number(parts[1]) - 1,
                1
            );

    }


    renderCalendar();


    showToast(
        "✅ " +
        imported +
        " records imported" +
        (skipped
            ? " • " + skipped + " skipped"
            : "")
    );

}


/* =========================================================
   NORMALIZE SHIFT
========================================================= */

function normalizeShift(value){

    const shift =
        String(value ?? "")
            .trim()
            .toLowerCase();


    if(!shift){
        return "";
    }


    if(
        shift === "day" ||
        shift.includes("☀") ||
        shift.includes("day shift")
    ){

        return "day";

    }


    if(
        shift === "night" ||
        shift.includes("🌙") ||
        shift.includes("night shift")
    ){

        return "night";

    }


    if(
        shift === "off" ||
        shift.includes("🟢")
    ){

        return "off";

    }


    if(
        shift === "leave" ||
        shift === "නිවාඩු" ||
        shift.includes("🟡")
    ){

        return "leave";

    }


    return "";

}


/* =========================================================
   NORMALIZE DATE
========================================================= */

function normalizeDate(value){

    if(
        value instanceof Date &&
        !isNaN(value.getTime())
    ){

        return dateKey(
            value.getFullYear(),
            value.getMonth(),
            value.getDate()
        );

    }


    if(typeof value === "number"){

        if(
            value > 0 &&
            value < 100000
        ){

            const date =
                new Date(
                    Date.UTC(
                        1899,
                        11,
                        30
                    ) +
                    value * 86400000
                );


            return (
                date.getUTCFullYear() +
                "-" +
                String(
                    date.getUTCMonth() + 1
                ).padStart(2,"0") +
                "-" +
                String(
                    date.getUTCDate()
                ).padStart(2,"0")
            );

        }

    }


    let str =
        String(value ?? "")
            .trim();


    if(!str){
        return "";
    }


    /*
       YYYY-MM-DD
    */

    let match =
        str.match(
            /^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/
        );


    if(match){

        const y = Number(match[1]);
        const m = Number(match[2]);
        const d = Number(match[3]);


        if(isValidDate(y,m,d)){

            return (
                y +
                "-" +
                String(m).padStart(2,"0") +
                "-" +
                String(d).padStart(2,"0")
            );

        }

    }


    /*
       DD/MM/YYYY
       DD-MM-YYYY
    */

    match =
        str.match(
            /^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})$/
        );


    if(match){

        const d = Number(match[1]);
        const m = Number(match[2]);
        const y = Number(match[3]);


        if(isValidDate(y,m,d)){

            return (
                y +
                "-" +
                String(m).padStart(2,"0") +
                "-" +
                String(d).padStart(2,"0")
            );

        }

    }


    /*
       Excel/JS date string
    */

    const parsed =
        new Date(str);


    if(!isNaN(parsed.getTime())){

        return dateKey(
            parsed.getFullYear(),
            parsed.getMonth(),
            parsed.getDate()
        );

    }


    return "";

}


/* =========================================================
   VALID DATE
========================================================= */

function isValidDate(year,month,day){

    if(
        month < 1 ||
        month > 12 ||
        day < 1 ||
        day > 31
    ){

        return false;

    }


    const d =
        new Date(
            year,
            month - 1,
            day
        );


    return (
        d.getFullYear() === year &&
        d.getMonth() === month - 1 &&
        d.getDate() === day
    );

}


/* =========================================================
   NORMALIZE TIME
========================================================= */

function convertTime(value){

    if(
        value === null ||
        value === undefined ||
        value === ""
    ){

        return "";

    }


    if(
        value instanceof Date &&
        !isNaN(value.getTime())
    ){

        return (
            String(
                value.getHours()
            ).padStart(2,"0") +
            ":" +
            String(
                value.getMinutes()
            ).padStart(2,"0")
        );

    }


    const str =
        String(value).trim();


    /*
       HH:MM
    */

    let match =
        str.match(
            /^(\d{1,2}):(\d{1,2})/
        );


    if(match){

        const h =
            Number(match[1]);

        const m =
            Number(match[2]);


        if(
            h >= 0 &&
            h <= 23 &&
            m >= 0 &&
            m <= 59
        ){

            return (
                String(h).padStart(2,"0") +
                ":" +
                String(m).padStart(2,"0")
            );

        }

    }


    /*
       Excel decimal time
    */

    const num =
        Number(str);


    if(
        !Number.isNaN(num) &&
        num >= 0 &&
        num < 1
    ){

        const total =
            Math.round(
                num * 1440
            ) % 1440;


        return (
            String(
                Math.floor(total / 60)
            ).padStart(2,"0") +
            ":" +
            String(
                total % 60
            ).padStart(2,"0")
        );

    }


    return "";

}


/* =========================================================
   CSV PARSER
========================================================= */

function parseCSV(text){

    const rows = [];

    let row = [];
    let value = "";
    let quotes = false;


    for(
        let i = 0;
        i < text.length;
        i++
    ){

        const c =
            text[i];

        const next =
            text[i + 1];


        if(
            c === '"' &&
            quotes &&
            next === '"'
        ){

            value += '"';

            i++;

            continue;

        }


        if(c === '"'){

            quotes = !quotes;

            continue;

        }


        if(
            c === "," &&
            !quotes
        ){

            row.push(value);

            value = "";

            continue;

        }


        if(
            (c === "\n" || c === "\r") &&
            !quotes
        ){

            if(
                c === "\r" &&
                next === "\n"
            ){

                i++;

            }


            row.push(value);

            rows.push(row);

            row = [];

            value = "";

            continue;

        }


        value += c;

    }


    if(
        value.length > 0 ||
        row.length > 0
    ){

        row.push(value);

        rows.push(row);

    }


    return rows;

}
